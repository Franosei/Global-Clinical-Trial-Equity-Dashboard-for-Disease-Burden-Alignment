# config/sources.yaml

# Study years (you can widen later)
years:
  start: 2000
  # "current" is resolved at runtime, so the pipeline does not silently go stale.
  end: current

live:
  # Reload completed snapshots from disk at this cadence. The upstream
  # ClinicalTrials.gov source itself refreshes on weekdays.
  dashboard_poll_seconds: 300
  freshness_warning_hours: 36
  forecast_horizon_years: 3
  forecast_lookback_years: 8
  simulation_draws: 500

# API call settings
retries:
  total: 5
  backoff_factor: 0.5   # exponential backoff: 0.5s, 1s, 2s, ...

# Data sources
# WHO Global Health Estimates: country DALYs by cause (absolute counts). Each
# analysis period uses the estimate years inside it, else the latest earlier.
who_ghe:
  release: "GHE2023"
  years: [2000, 2010, 2015, 2019, 2020, 2021, 2022, 2023]
  daly_by_country_url: "https://cdn.who.int/media/docs/default-source/gho-documents/global-health-estimates/daly_bycountry_age_sex_{year}_2026-10-01.xlsx"

ctgov:
  base_url: "https://clinicaltrials.gov/api/v2/"
  page_size: 1000
  date_rule: "start"
  # ClinicalTrials.gov reserves "clinical trial" for interventional studies.
  # Observational studies and expanded-access records are deliberately excluded
  # from the equity numerator and facility-capacity model.
  study_types: ["INTERVENTIONAL"]
  # A current registry record can omit countries whose locations were removed
  # after a study began. Keep those countries in historical study-country
  # activity, but never infer facility-level capacity from them.
  include_removed_countries: true
  site_fields: ["locations", "overallStatus", "phase", "sponsors"]

# Manual validation is deliberately separate from matcher unit tests. Set this
# true only after an independent reviewer has completed the blinded sample and
# the generated disease-matching report has been checked and approved.
disease_matching_review:
  independently_verified: false
  min_reviewed_per_disease: 10

world_bank:
  base_url: "https://api.worldbank.org/v2/"
  # ICP 2021 price level index for "Actual health" (World = 100) scales site
  # costs between countries. 2021 is the ICP benchmark year.
  icp_source: "90"
  icp_year: 2021

# Resource-aware site planner. Monetary values are planner inputs, entered in
# US dollars at the reference country's price level, and are editable in the
# dashboard. They are starting points, not estimates for any specific protocol.
planner:
  reference_country: USA
  # Set true only after replacing the defaults below with protocol-specific,
  # finance-approved estimates. The validation command reports operational
  # planning as provisional while this remains false.
  cost_inputs_verified: false
  # Illustrative placeholders only: replace with protocol-specific estimates.
  study_startup_cost: 25000
  # One-time cost to qualify and equip a facility with no research history for
  # this disease. No robust public benchmark exists: set from your own data.
  new_site_cost: 100000
  budget: 5000000
  # A facility is eligible for the historical-activity proxy if it listed a
  # study in the selected years or this many earlier windows of equal length.
  recency_windows: 1
  # Assumed new-site throughput uses facilities in the same country when at
  # least this many have history, else the income group, else global.
  min_facilities_for_benchmark: 5

gbd_ihme:
  base_url: "http://ghdx.healthdata.org/gbd-results-tool"
  notes: "IHME data often comes as bulk CSV download; may require manual seed or scripted fetch."

globocan:
  base_url: "https://gco.iarc.fr/today/"
  notes: "Cancer incidence/mortality by country; CSV export available."
